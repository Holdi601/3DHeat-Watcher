title: 3DHeat Watcher
description: Records what games publish about your play, in the background, into files on your own machine.
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
search_enabled: true
heading_anchors: true
aux_links:
  "GitHub": "https://github.com/Holdi601/3DHeat-Watcher"
  "3DHeat": "https://holdi601.github.io/3DHeat/"
exclude:
  - wiki
  - "*.py"
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

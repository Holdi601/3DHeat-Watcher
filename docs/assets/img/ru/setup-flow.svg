<svg xmlns="http://www.w3.org/2000/svg" width="848" height="299" viewBox="0 0 848 299" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="setup: switching a game&#x27;s own output on">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="848" height="299" rx="10" fill="#ffffff" stroke="#dadce0"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#202124">setup: включение собственного вывода игры</text>
<rect x="24" y="69.5" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="142.0" y="95.5" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">setup &lt;id&gt; | all</text>
<text x="142.0" y="114.5" text-anchor="middle" font-size="14" fill="#3c4043">читает файл настроек игры</text>
<rect x="306" y="60.0" width="236" height="79" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="1.5"/>
<text x="424.0" y="86.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">изменит ...</text>
<text x="424.0" y="105.0" text-anchor="middle" font-size="14" fill="#3c4043">выводит файл и изменение;</text>
<text x="424.0" y="124.0" text-anchor="middle" font-size="14" fill="#3c4043">ничего не пишется</text>
<rect x="588" y="69.5" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="706.0" y="95.5" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">setup &lt;id&gt; --apply</text>
<text x="706.0" y="114.5" text-anchor="middle" font-size="14" fill="#3c4043">меняет его</text>
<line x1="260" y1="99.5" x2="304" y2="99.5" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="542" y1="99.5" x2="586" y2="99.5" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M706.0,129.5 V162.0 H142.0 V183.0" fill="none" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="185.0" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="142.0" y="211.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">&lt;file&gt;.heat3d-backup</text>
<text x="142.0" y="230.0" text-anchor="middle" font-size="14" fill="#3c4043">оригинал, сохраняется</text>
<rect x="24" y="265" width="18" height="18" rx="3" fill="#e8f0fe" stroke="#3b6fd8"/>
<text x="48" y="279" font-size="14" fill="#3c4043">шаг</text>
<rect x="88.0" y="265" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#2e8b57"/>
<text x="112.0" y="279" font-size="14" fill="#3c4043">записанные файлы</text>
<rect x="219.5" y="265" width="18" height="18" rx="3" fill="#fff1e0" stroke="#d9822b"/>
<text x="243.5" y="279" font-size="14" fill="#3c4043">один файл на матч</text>
</svg>

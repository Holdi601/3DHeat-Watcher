<svg xmlns="http://www.w3.org/2000/svg" width="848" height="660" viewBox="0 0 848 660" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="The watcher: what games publish, into files on your machine">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="472" viewBox="0 0 1098 472" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="1098" height="472" rx="10" fill="#ffffff" stroke="#dadce0"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#202124">The watcher: what games publish, into files on your machine</text>
<rect x="24" y="56.0" width="210" height="64" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="129.0" y="84.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">telemetry</text>
<text x="129.0" y="101.5" text-anchor="middle" font-size="12" fill="#5f6368">UDP ports, shared memory</text>
<rect x="24" y="138.0" width="210" height="64" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="129.0" y="166.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">game-state integration</text>
<text x="129.0" y="183.5" text-anchor="middle" font-size="12" fill="#5f6368">local APIs, web maps</text>
<rect x="24" y="220.0" width="210" height="64" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="129.0" y="248.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">logs and journals</text>
<text x="129.0" y="265.5" text-anchor="middle" font-size="12" fill="#5f6368">files the game writes</text>
<rect x="24" y="302.0" width="210" height="64" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="129.0" y="330.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">replays</text>
<text x="129.0" y="347.5" text-anchor="middle" font-size="12" fill="#5f6368">saved after a match</text>
<rect x="24" y="384.0" width="210" height="64" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="129.0" y="412.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">Steam, NVIDIA</text>
<text x="129.0" y="429.5" text-anchor="middle" font-size="12" fill="#5f6368">stats, timeline, highlights</text>
<rect x="304" y="213.5" width="210" height="77" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="409.0" y="240.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">run</text>
<text x="409.0" y="257.0" text-anchor="middle" font-size="12" fill="#5f6368">notices the running game,</text>
<text x="409.0" y="274.0" text-anchor="middle" font-size="12" fill="#5f6368">starts its adapter</text>
<rect x="584" y="172.5" width="210" height="77" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="689.0" y="199.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">session folder</text>
<text x="689.0" y="216.0" text-anchor="middle" font-size="12" fill="#5f6368">events.jsonl, heat.parquet,</text>
<text x="689.0" y="233.0" text-anchor="middle" font-size="12" fill="#5f6368">meta.json, heat.raw.parquet</text>
<rect x="584" y="267.5" width="210" height="64" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="689.0" y="296.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">watcher.sqlite</text>
<text x="689.0" y="313.0" text-anchor="middle" font-size="12" fill="#5f6368">sessions, events, stats</text>
<rect x="864" y="179.0" width="210" height="64" rx="8" fill="#f3e8fd" stroke="#8a4fd0" stroke-width="1.5"/>
<text x="969.0" y="207.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">3DHeat viewer</text>
<text x="969.0" y="224.5" text-anchor="middle" font-size="12" fill="#5f6368">heatmaps, route lines</text>
<rect x="864" y="261.0" width="210" height="64" rx="8" fill="#f3e8fd" stroke="#8a4fd0" stroke-width="1.5"/>
<text x="969.0" y="289.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">stats, sessions, --csv</text>
<text x="969.0" y="306.5" text-anchor="middle" font-size="12" fill="#5f6368">totals per game, CSV files</text>

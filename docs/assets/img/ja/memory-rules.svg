<svg xmlns="http://www.w3.org/2000/svg" width="848" height="299" viewBox="0 0 848 299" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Reading memory: every condition must hold">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="848" height="299" rx="10" fill="#ffffff" stroke="#dadce0"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#202124">メモリの読み取り: すべての条件を満たす必要</text>
<rect x="24" y="60.0" width="236" height="60" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="142.0" y="86.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">memory = true</text>
<text x="142.0" y="105.0" text-anchor="middle" font-size="14" fill="#3c4043">既定ではオフ</text>
<rect x="306" y="60.0" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="424.0" y="86.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">シングルプレイヤーのゲーム</text>
<text x="424.0" y="105.0" text-anchor="middle" font-size="14" fill="#3c4043">マルチプレイヤーのものは決して</text>
<rect x="588" y="60.0" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="706.0" y="86.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">確認済みのプロファイル</text>
<text x="706.0" y="105.0" text-anchor="middle" font-size="14" fill="#3c4043">この正確なビルド用</text>
<line x1="260" y1="90.0" x2="304" y2="90.0" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="542" y1="90.0" x2="586" y2="90.0" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M706.0,120.0 V143.0 H142.0 V173.5" fill="none" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="175.5" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="142.0" y="201.5" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">アンチチートなし</text>
<text x="142.0" y="220.5" text-anchor="middle" font-size="14" fill="#3c4043">インストール済みまたは実行中</text>
<rect x="306" y="175.5" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="424.0" y="201.5" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">外への接続なし</text>
<text x="424.0" y="220.5" text-anchor="middle" font-size="14" fill="#3c4043">ゲームがオフライン</text>
<rect x="588" y="166.0" width="236" height="79" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="706.0" y="192.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">読み取りのみ</text>
<text x="706.0" y="211.0" text-anchor="middle" font-size="14" fill="#3c4043">何も書かず、フックもしない</text>
<text x="706.0" y="230.0" text-anchor="middle" font-size="14" fill="#3c4043">または注入</text>
<line x1="260" y1="205.5" x2="304" y2="205.5" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="542" y1="205.5" x2="586" y2="205.5" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="848" height="432" viewBox="0 0 848 432" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Server recorder mods: a whole mission, recorded on the server">

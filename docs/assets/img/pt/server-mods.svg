<rect x="24" y="60.0" width="236" height="60" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="142.0" y="86.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">servidor do Arma 3</text>
<text x="142.0" y="105.0" text-anchor="middle" font-size="14" fill="#3c4043">-serverMod=@heat3d</text>
<rect x="24" y="136.0" width="236" height="60" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="142.0" y="162.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">servidor do Arma Reforger</text>
<text x="142.0" y="181.0" text-anchor="middle" font-size="14" fill="#3c4043">mod Heat3DRecorder</text>

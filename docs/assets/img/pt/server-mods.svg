<text x="706.0" y="114.5" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">eventos</text>
<text x="706.0" y="133.5" text-anchor="middle" font-size="14" fill="#3c4043">abates, acertos, entrar / sair,</text>
<text x="706.0" y="152.5" text-anchor="middle" font-size="14" fill="#3c4043">entradas, fim da missão</text>

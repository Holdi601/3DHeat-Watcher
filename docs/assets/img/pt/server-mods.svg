<text x="142.0" y="344.0" text-anchor="middle" font-weight="600" font-size="16" fill="#202124">&lt;sessão&gt;.jsonl</text>
<text x="142.0" y="363.0" text-anchor="middle" font-size="14" fill="#3c4043">Reforger: uma linha por item</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1658" height="157" viewBox="0 0 1658 157" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="1658" height="157" rx="10" fill="#ffffff" stroke="#dadce0"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#202124">Updates: checked at start, applied between games</text>
<rect x="24" y="62.5" width="210" height="64" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
<text x="129.0" y="91.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">start</text>
<text x="129.0" y="108.0" text-anchor="middle" font-size="12" fill="#5f6368">any command</text>
<rect x="304" y="56.0" width="210" height="77" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="409.0" y="82.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">release check</text>
<text x="409.0" y="99.5" text-anchor="middle" font-size="12" fill="#5f6368">GitHub releases, at most</text>
<text x="409.0" y="116.5" text-anchor="middle" font-size="12" fill="#5f6368">every few hours</text>
<rect x="584" y="62.5" width="210" height="64" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="689.0" y="91.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">newer version?</text>
<text x="689.0" y="108.0" text-anchor="middle" font-size="12" fill="#5f6368">said once; offered</text>
<rect x="864" y="62.5" width="210" height="64" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="1.5"/>
<text x="969.0" y="91.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">no game running</text>
<text x="969.0" y="108.0" text-anchor="middle" font-size="12" fill="#5f6368">never mid-game</text>
<rect x="1144" y="56.0" width="210" height="77" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="1249.0" y="82.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">update</text>
<text x="1249.0" y="99.5" text-anchor="middle" font-size="12" fill="#5f6368">git pull, or the release</text>
<text x="1249.0" y="116.5" text-anchor="middle" font-size="12" fill="#5f6368">archive after its check</text>
<rect x="1424" y="62.5" width="210" height="64" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="1529.0" y="91.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">start again</text>
<text x="1529.0" y="108.0" text-anchor="middle" font-size="12" fill="#5f6368">recordings untouched</text>

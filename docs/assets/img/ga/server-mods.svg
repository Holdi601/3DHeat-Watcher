<text x="706.0" y="133.5" text-anchor="middle" font-size="14" fill="#3c4043">maruithe, buillí, dul isteach / amach,</text>
<text x="706.0" y="152.5" text-anchor="middle" font-size="14" fill="#3c4043">ag teacht isteach, deireadh misin</text>

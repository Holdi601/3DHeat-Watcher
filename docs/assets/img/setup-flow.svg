<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="157" viewBox="0 0 1098 157" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<rect width="1098" height="157" rx="10" fill="#ffffff" stroke="#dadce0"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#202124">setup: switching a game&#x27;s own output on</text>
<rect x="24" y="62.5" width="210" height="64" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="129.0" y="91.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">setup &lt;id&gt; | all</text>
<text x="129.0" y="108.0" text-anchor="middle" font-size="12" fill="#5f6368">reads the game&#x27;s settings file</text>
<rect x="304" y="56.0" width="210" height="77" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="1.5"/>
<text x="409.0" y="82.5" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">would change ...</text>
<text x="409.0" y="99.5" text-anchor="middle" font-size="12" fill="#5f6368">prints the file and the change;</text>
<text x="409.0" y="116.5" text-anchor="middle" font-size="12" fill="#5f6368">nothing is written</text>
<rect x="584" y="62.5" width="210" height="64" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="689.0" y="91.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">setup &lt;id&gt; --apply</text>
<text x="689.0" y="108.0" text-anchor="middle" font-size="12" fill="#5f6368">changes it</text>
<rect x="864" y="62.5" width="210" height="64" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="969.0" y="91.0" text-anchor="middle" font-weight="600" font-size="14" fill="#202124">&lt;file&gt;.heat3d-backup</text>
<text x="969.0" y="108.0" text-anchor="middle" font-size="12" fill="#5f6368">the original, kept</text>
<line x1="234" y1="94.5" x2="302" y2="94.5" stroke="#5f6368" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="514" y1="94.5" x2="582" y2="94.5" stroke="#5f6368" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="794" y1="94.5" x2="862" y2="94.5" stroke="#5f6368" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
